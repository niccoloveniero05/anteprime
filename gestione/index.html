<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#100F09">
<title>Gestione Veniello</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #100F09; color: #F3EEE4;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 360px; }
  .logo { font: italic 700 64px/1 Georgia, "Times New Roman", serif; color: #F3EEE4; position: relative; display: inline-block; margin-bottom: 18px; }
  .logo::after { content: ""; position: absolute; top: 4px; right: -16px; width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sotto { margin: 0 0 22px; color: rgba(243,238,228,.62); font-size: 15px; }
  label { display: block; font-size: 13px; color: rgba(243,238,228,.72); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; font-size: 18px; padding: 13px 14px; border-radius: 12px;
    border: 1px solid rgba(243,238,228,.22); background: #1A1811; color: #F3EEE4; outline: none;
  }
  input[type=password]:focus { border-color: #FF5A1F; box-shadow: 0 0 0 3px rgba(255,90,31,.25); }
  button {
    width: 100%; margin-top: 16px; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px;
    background: #FF5A1F; color: #100F09; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #messaggio { min-height: 22px; margin: 14px 0 0; font-size: 15px; color: rgba(243,238,228,.7); }
  #messaggio.errore { color: #FF8A5C; font-weight: 600; }
  .nota { margin: 26px 0 0; font-size: 12px; line-height: 1.5; color: rgba(243,238,228,.42); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">V</div>
  <h1>Gestione Veniello</h1>
  <p class="sotto">Area riservata di Veniello Studio.</p>
  <form id="form" autocomplete="on">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" required>
    <button id="entra" type="submit">Entra</button>
  </form>
  <p id="messaggio" role="status" aria-live="polite"></p>
  <p class="nota">La pagina si apre direttamente sul tuo telefono: la password non viene mandata a nessun server e non viene salvata in questa pagina. Se il telefono ti propone di salvarla, di' sì: la prossima volta la scrive lui.</p>
</main>

  var GIRI = 300000;

  // La versione vecchia di questa pagina salvava qui la chiave («Ricordami»): la togliamo, sempre.
  try { localStorage.removeItem("gestioneVeniello.chiave"); } catch (e) {}

  var form = document.getElementById("form");
  var campo = document.getElementById("password");
  var bottone = document.getElementById("entra");
  var messaggio = document.getElementById("messaggio");

  function b64aBytes(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function mostra(testo, errore) { messaggio.textContent = testo || ""; messaggio.className = errore ? "errore" : ""; }
  function occupato(si) { bottone.disabled = si; bottone.textContent = si ? "Apro\u2026" : "Entra"; }

  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle || !window.TextEncoder) {
    mostra("Questo browser non riesce ad aprire la pagina: serve un indirizzo https e un browser aggiornato.", true);
    bottone.disabled = true;
    return;
  }

  function chiaveDaPassword(pw) {
    return subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return subtle.deriveKey(
        { name: "PBKDF2", salt: b64aBytes(SALE), iterations: GIRI, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }
  function decifra(chiave) {
    return subtle.decrypt({ name: "AES-GCM", iv: b64aBytes(IV) }, chiave, b64aBytes(CIFRATO)).then(function (chiaro) {
      return new TextDecoder().decode(chiaro);
    });
  }
  // Sostituisce tutta la pagina con la dashboard. Attenzione: se document.open() viene chiamato
  // mentre il browser sta ancora leggendo questa pagina, per regola non fa nulla e document.write
  // AGGIUNGE la dashboard sotto il lucchetto invece di sostituirlo. Quindi aspettiamo che la pagina
  // sia finita di caricare (con il modulo compilato a mano non succede, ma costa niente).
  function apri(html) {
    function sostituisci() { document.open(); document.write(html); document.close(); }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { setTimeout(sostituisci, 0); });
    } else {
      setTimeout(sostituisci, 0);
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = campo.value.trim();
    if (!pw) { mostra("Scrivi la password.", true); campo.focus(); return; }
    occupato(true);
    mostra("");
    chiaveDaPassword(pw).then(decifra).then(apri).catch(function () {
      occupato(false);
      mostra("Password sbagliata", true);
      campo.focus();
      try { campo.select(); } catch (e) {}
    });
  });
})();
